<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>EV Demand Prediction & Analytics</title>

    <style>
        body {
            background: #0d0d0d;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .nav {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .nav a {
            color: #ccc;
            text-decoration: none;
            padding-bottom: 5px;
        }

        .nav a.active {
            border-bottom: 2px solid #ff5252;
            color: #ff5252;
        }

        .card-container {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: #000;
            padding: 20px;
            width: 200px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        }

        .card h3 {
            margin: 0;
            opacity: 0.7;
        }

        .value {
            font-size: 32px;
            font-weight: bold;
            margin-top: 10px;
        }

        .growth {
            margin-top: 10px;
            display: inline-block;
            padding: 5px 10px;
            border-radius: 6px;
            background: #ff6161;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <h1>⚡ EV Demand Prediction & Analytics</h1>

    <div class="nav">
        <a class="active" href="#">Dashboard</a>
        <a href="#">AI Analyst</a>
        <a href="#">Raw Data</a>
    </div>

    <div class="card-container">
        <div class="card">
            <h3>Total EV Demand</h3>
            <div class="value">95</div>
            <div class="growth">▼ -2.1% Growth</div>
        </div>

        <div class="card">
            <h3>Battery EVs (BEV)</h3>
            <div class="value">70</div>
        </div>

        <div class="card">
            <h3>Plug-in Hybrids (PHEV)</h3>
            <div class="value">25</div>
        </div>
    </div>

</body>
</html>
