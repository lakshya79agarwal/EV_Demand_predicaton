<!DOCTYPE html>
<html>
<head>
    <title>EV Demand Forecast Dashboard</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body>
    <h1>EV Demand Forecast with OpenAI Insights</h1>

    <div id="forecast_plot"></div>
    <script>
        var plotData = {{ plot_json | safe }};
        Plotly.newPlot('forecast_plot', plotData.data, plotData.layout);
    </script>

    <form method="post">
        <label>Ask a question about EV forecast:</label><br>
        <input type="text" name="query" size="80"><br><br>
        <input type="submit" value="Get Insight">
    </form>

    {% if openai_reply %}
        <h3>OpenAI Insight:</h3>
        <p>{{ openai_reply }}</p>
    {% endif %}
</body>
</html>
